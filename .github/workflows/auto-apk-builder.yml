name: Auto APK Builder

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build"
        required: true
        default: "main"
      build_type:
        description: "Build type: release or debug"
        required: true
        default: "release"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 1

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache-dependency-path: "**/package-lock.json"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache Gradle & Android build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/package-lock.json', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Detect project and build APK
        run: |
          set -e
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          if [ -z "$BUILD_TYPE" ]; then
            BUILD_TYPE="release"
          fi

          echo "=== Target Build Type: $BUILD_TYPE ==="

          if [ "$BUILD_TYPE" = "release" ]; then
            GRADLE_TASK="assembleRelease"
          else
            GRADLE_TASK="assembleDebug"
          fi

          # Fast build flags: Target physical mobile devices (arm64-v8a, armeabi-v7a)
          # Skips compiling C++ for x86 emulators, cutting compilation time by 50%+
          FAST_FLAGS="-PreactNativeArchitectures=arm64-v8a,armeabi-v7a --build-cache"

          echo "=== Detecting project type ==="
          if [ -f "package.json" ] && grep -q '"expo"' package.json; then
            echo ">>> Expo project detected"
            if [ ! -d "node_modules" ]; then
              npm install --prefer-offline --no-audit
            else
              echo ">>> node_modules restored from cache!"
            fi
            npx expo prebuild --platform android --clean
            cd android
            chmod +x gradlew
            ./gradlew $GRADLE_TASK $FAST_FLAGS
          elif [ -f "gradlew" ]; then
            echo ">>> Native Android project detected (gradlew in root)"
            chmod +x gradlew
            ./gradlew $GRADLE_TASK --build-cache
          elif [ -f "android/gradlew" ]; then
            echo ">>> React Native project detected (gradlew in android/)"
            cd android
            chmod +x gradlew
            ./gradlew $GRADLE_TASK $FAST_FLAGS
          elif [ -f "package.json" ]; then
            echo ">>> React Native (bare) project detected — installing deps"
            if [ ! -d "node_modules" ]; then
              npm install --prefer-offline --no-audit
            fi
            cd android
            chmod +x gradlew
            ./gradlew $GRADLE_TASK $FAST_FLAGS
          else
            echo "ERROR: Could not detect Android project type"
            ls -la
            exit 1
          fi
        env:
          NODE_ENV: production
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true -Dorg.gradle.jvmargs=-Xmx4096m"

      - name: Sign Release APK if unsigned
        run: |
          set -e
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          echo "Checking APK signature requirement (BUILD_TYPE: $BUILD_TYPE)..."

          UNSIGNED_APK=$(find . -name "*release*unsigned*.apk" | head -1)

          if [ -n "$UNSIGNED_APK" ]; then
            echo ">>> Found unsigned release APK: $UNSIGNED_APK"
            echo ">>> Generating signing key and signing with apksigner..."

            # Generate keystore
            keytool -genkey -v -keystore auto_release.keystore -alias autoReleaseKey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=AutoAPK, OU=Engineering, O=AutoAPK, L=City, S=State, C=US" \
              -storepass android -keypass android

            # Locate Android build tools (zipalign & apksigner)
            BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
            echo "Using Android build tools from: $BUILD_TOOLS_DIR"

            # Align
            ALIGNED_APK="${UNSIGNED_APK%.apk}-aligned.apk"
            $BUILD_TOOLS_DIR/zipalign -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"

            # Sign
            SIGNED_APK="${UNSIGNED_APK%-unsigned.apk}.apk"
            $BUILD_TOOLS_DIR/apksigner sign --ks auto_release.keystore \
              --ks-pass pass:android --key-pass pass:android \
              --out "$SIGNED_APK" "$ALIGNED_APK"

            echo ">>> Successfully signed release APK: $SIGNED_APK"
          else
            echo "No unsigned release APK found or build is debug. Existing APK will be used."
          fi

      - name: Locate Final APK
        id: find_apk
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          if [ "$BUILD_TYPE" = "release" ]; then
            # Search for signed release APK (exclude unsigned and aligned intermediate files)
            APK=$(find . -name "*release*.apk" ! -name "*unsigned*" ! -name "*aligned*" | head -1)
          else
            APK=$(find . -name "*debug*.apk" | head -1)
          fi

          if [ -z "$APK" ]; then
            # Fallback to any valid APK
            APK=$(find . -name "*.apk" ! -name "*unsigned*" ! -name "*aligned*" | head -1)
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: No installable APK found!"
            find . -name "*.apk" || true
            exit 1
          fi

          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "Final APK ready for distribution: $APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 7
          if-no-files-found: error
