name: Auto APK Builder

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to build"
        required: true
        default: "main"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 1

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache-dependency-path: "**/package-lock.json"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Detect project type and build APK
        run: |
          set -e
          echo "=== Detecting project type ==="

          if [ -f "package.json" ] && grep -q '"expo"' package.json; then
            echo ">>> Expo project detected"
            npm install
            npx expo prebuild --platform android --clean
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --build-cache
          elif [ -f "gradlew" ]; then
            echo ">>> Native Android project detected (gradlew in root)"
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --build-cache
          elif [ -f "android/gradlew" ]; then
            echo ">>> React Native project detected (gradlew in android/)"
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --build-cache
          elif [ -f "package.json" ]; then
            echo ">>> React Native (bare) project detected — installing deps first"
            npm install
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon --build-cache
          else
            echo "ERROR: Could not detect Android project type"
            ls -la
            exit 1
          fi
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.configureondemand=true"

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find . -name "*.apk" -path "*/debug/*" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: No debug APK found"
            find . -name "*.apk" || true
            exit 1
          fi
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 7
          if-no-files-found: error
